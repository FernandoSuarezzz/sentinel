[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "A machine-learning firewall that detects prompt-injection attacks against LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Fernando Suárez Alonso" }]

# Serving dependencies only: the production image never installs PyTorch.
dependencies = [
  "numpy>=1.26",
  "onnxruntime>=1.18",
  "tokenizers>=0.19",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
train = [
  "torch>=2.3",
  "transformers>=4.46",
  "datasets>=2.19",
  "accelerate>=0.30",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.4",
  "mlflow>=2.12",
  "onnx>=1.16",
  "pyyaml>=6",
  "tabulate>=0.9",
]
demo = ["gradio>=4.40", "huggingface_hub>=0.23"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "pandas>=2.2", "scikit-learn>=1.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Notebooks use Jupyter-only names (`_exit_code`, `!` commands); lint the package instead.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
